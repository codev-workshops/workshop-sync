# are created and populated on the next run, then moved into `pairs:`.
new_repos: []


# Same name in both orgs, completely different history. Documented so nobody ever
# "fixes" the map by matching these on name.
# Resolved on 2026-09-01: the unrelated same-name repo was renamed to `<name>-lab` and
# archived, then the real copy took the source name — so `target` now equals `source`
# everywhere except workshop-content -> workshop-metadata (this repo).
collisions:
  - source: ordermanager-monolith
    real_target: ordermanager-monolith          # was app_dotnet-angular-monolith
    unrelated_same_name_target: ordermanager-monolith-lab           # archived
  - source: ordermanager-iac
    real_target: ordermanager-iac               # was app_dotnet-angular-monolith-iac
    unrelated_same_name_target: ordermanager-iac-lab                # archived
  - source: uc-data-source-migration-jdbc-normalization
    real_target: uc-data-source-migration-jdbc-normalization
    # was uc-data-source-migration-legacy-to-modern
    unrelated_same_name_target: uc-data-source-migration-jdbc-normalization-lab   # archived
  - source: ordermanager-microservices
    real_target: ordermanager-microservices     # was ts-ordermanager-microservices
    unrelated_same_name_target: ordermanager-microservices-lab      # archived

# Duplicate copies inside codev-workshops (same root commit), archived on 2026-09-01.
# Listed here so the sync never writes to them.
